{% set portal_nav = [
('Getting started', 'getting-started'),
('Catalogue', 'catalogue'),
('Contacts', 'contacts'),
] %}
<nav class="edh-portal-header">
  <div class="edh-portal-header__inner">
    <div class="edh-portal-header__brand-group">
      <a class="edh-portal-header__destine-logo" href="{{ desp_platform_url }}/" target="_destine"
        rel="noopener noreferrer">
        <img src="{{ pathto('_static/images/portal/funders/destination_earth_logo.svg', 1) }}" alt="Destination Earth">
      </a>
      <a class="edh-portal-header__edh-logo" href="{{ portal_url }}/" aria-label="Earth Data Hub homepage">
        <img class="edh-portal-header__edh-logo-full" src="{{ pathto('_static/images/portal/logo-1x-dark.png', 1) }}"
          alt="Earth Data Hub">
        <img class="edh-portal-header__edh-logo-minimal"
          src="{{ pathto('_static/images/portal/logo-1x-dark-minimal.png', 1) }}" alt="Earth Data Hub">
      </a>
    </div>

    <div class="edh-portal-header__nav-actions">
      <ul class="edh-portal-header__nav-list" aria-label="Earth Data Hub portal navigation">
        {% for label, path in portal_nav %}
        <li><a class="edh-portal-header__nav-link" href="{{ portal_url }}/{{ path }}">{{ label }}</a></li>
        {% endfor %}
      </ul>
    </div>

    <div class="edh-portal-menu edh-portal-header__mobile-menu" data-portal-menu>
      <button class="edh-portal-header__mobile-button" type="button" aria-label="Navigation menu"
        aria-controls="edh-header-mobile-menu" aria-expanded="false" data-portal-menu-button>
        {% include "partials/portal-menu-toggle-icons.html" %}
      </button>
      <div id="edh-header-mobile-menu" class="edh-portal-header__mobile-panel" data-portal-menu-panel hidden>
        {% for label, path in portal_nav %}
        <a href="{{ portal_url }}/{{ path }}">{{ label }}</a>
        {% endfor %}
      </div>
    </div>

  </div>
</nav>
