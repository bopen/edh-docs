name: build-image

on:
  push:
    tags:
    - '*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag for the image to build'
        required: true
        default: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash -l {0}

env:
  IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}

jobs:

  build-docker-image:
    name: Build edh-docs:${{ inputs.image_tag || github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: bopen/edh-docs
        persist-credentials: false
    - name: Copy git-clone-ref.py script
      uses: bopen/ci-cd/copy-git-clone-script@5f20e1c690b01bfda07dd235d068e665ad2ad581 # v2.1
      with:
        target-path: bopen
    - name: Harbor login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ vars.HARBOR_URL }}
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      with:
        # the docker-container driver's bundled runc fails on bopen runners
        driver: docker
    - name: Build and push
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        push: true
        platforms: linux/amd64
        context: bopen
        file: bopen/edh-docs/Dockerfile
        tags: |
          ${{ vars.HARBOR_URL }}/hedp/edh-docs:${{ env.IMAGE_TAG }}

  security-scan:
    name: Security scan edh-docs:${{ inputs.image_tag || github.ref_name }}
    runs-on: ubuntu-latest
    needs: build-docker-image
    permissions: {}
    env:
      # runners have mixed architectures: always scan the published platform
      TRIVY_PLATFORM: linux/amd64
      GRYPE_PLATFORM: linux/amd64
    steps:
    - name: Harbor login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ vars.HARBOR_URL }}
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        image-ref: ${{ vars.HARBOR_URL }}/hedp/edh-docs:${{ env.IMAGE_TAG }}
        exit-code: '0'
        format: table
        ignore-unfixed: true
        vuln-type: os,library
        output: trivy-report-edh-docs-${{ github.run_id }}.txt
    - name: Upload Trivy Vulnerability Scan Results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: trivy-report
        path: trivy-report-edh-docs-${{ github.run_id }}.txt
        retention-days: 30
    - name: Add Trivy report in the summary
      run: |
        echo "## Trivy report for edh-docs:${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat trivy-report-edh-docs-${{ github.run_id }}.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Run Grype scan
      uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6.5.1
      with:
        image: ${{ vars.HARBOR_URL }}/hedp/edh-docs:${{ env.IMAGE_TAG }}
        fail-build: false
        output-format: table
        output-file: grype-report-edh-docs-${{ github.run_id }}.txt
    - name: Upload Grype Vulnerability Scan Results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: grype-report
        path: grype-report-edh-docs-${{ github.run_id }}.txt
        retention-days: 30
    - name: Add Grype report in the summary
      run: |
        echo "## Grype report for edh-docs:${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat grype-report-edh-docs-${{ github.run_id }}.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

