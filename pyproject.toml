[dependency-groups]
dev = [
  "pre-commit>=4.6.2"
]

[project]
dependencies = [
  "ipywidgets>=8.1.9",
  "myst-parser>=5.1.0",
  "nbsphinx>=0.9.8",
  "shibuya>=2026.7.12",
  "sphinx>=9.1.0",
  "sphinx-collections",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7.0",
  "sphinx-iconify>=0.3.0",
  "sphinx-sitemap>=2.9.0",
  "sphinx-togglebutton>=0.4.5",
  "sphinxcontrib-youtube>=1.5.0",
  "starlette>=1.7.0",
  "uvicorn>=0.54.0",
]
name = "edh-docs"
requires-python = ">=3.14"
version = "0.1.0"

[tool.uv.sources]
sphinx-collections = { git = "https://github.com/malmans2/sphinx-collections", rev = "git-pull" }

[project.optional-dependencies]
extra = ["uvicorn"]

[tool.setuptools]
packages = ["edh_docs"]