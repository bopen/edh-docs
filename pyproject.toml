[dependency-groups]
dev = [
  "pre-commit>=4.7.0"
]

[project]
dependencies = [
  "ipywidgets>=8.1.9",
  "myst-parser>=5.1.0",
  "nbsphinx>=0.9.8",
  "shibuya>=2026.7.12",
  "sphinx>=9.1.1",
  "sphinx-collections",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7.0",
  "sphinx-iconify>=0.3.0",
  "sphinx-llm>=1.1.0",
  "sphinx-notfound-page>=1.1.0",
  "sphinx-sitemap>=2.9.0",
  "sphinx-substitution-extensions>=2026.10.9",
  "sphinx-togglebutton>=0.4.5",
  "sphinxcontrib-youtube>=1.5.0"
]
license = "Apache-2.0"
license-files = ["LICENSE-CODE"]
name = "edh-docs"
requires-python = ">=3.14"
version = "0.1.0"

[tool.uv]
# certifi >= 2026.10.19 fixes GHSA-6q48-6c7w-9gw2
constraint-dependencies = ["certifi>=2026.10.19"]
